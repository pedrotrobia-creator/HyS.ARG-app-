name: Generar PDF del Formulario

on:
  push:
    paths:
      - 'formularios/formulario-completo.md'
  workflow_dispatch:

jobs:
  to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Obtener archivos
        uses: actions/checkout@v4

      - name: Instalar WeasyPrint y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint
          pip install markdown

      - name: 📄 Convertir Markdown a PDF
        run: weasyprint formularios/formulario-completo.md formularios/formulario-completo.pdf

      - name: 📤 Subir PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: formulario-pdf
          path: formularios/formulario-completo.pdf
          retention-days: 30
