name: Generar PDF del Formulario

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar archivos del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Verificar que README.md existe
        run: |
          ls -la
          if [ -f "README.md" ]; then
            echo "✅ ¡ENCONTRADO! Listo para convertir"
          else
            echo "❌ NO se encontró README.md"
            exit 1
          fi

      - name: 📦 Instalar Pandoc y WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: 📄 Convertir a PDF
        run: pandoc README.md -o README.pdf --pdf-engine=weasyprint

      - name: 📤 Subir PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: formulario-pdf
          path: README.pdf
          retention-days: 30
