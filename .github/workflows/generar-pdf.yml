name: Generar PDF del Formulario

on:
  push:
    paths:
      - 'formularios/formulario-completo.md'
  workflow_dispatch:

jobs:
  to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Obtener archivos
        uses: actions/checkout@v4

      - name: 📦 Instalar Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

      - name: 📄 Convertir Markdown a PDF
        run: |
          pandoc formularios/formulario-completo.md \
            -o formularios/formulario-completo.pdf \
            --pdf-engine=xelatex \
            -V geometry:margin=2cm \
            -V mainfont="DejaVu Sans" \
            -V fontsize=11pt

      - name: 📤 Subir PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: formulario-pdf
          path: formularios/formulario-completo.pdf
          retention-days: 30
