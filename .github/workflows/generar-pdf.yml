name: Generar PDF del Formulario

on:
  push:
    paths:
      - 'readme.md'
  workflow_dispatch:

jobs:
  to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 📦 Instalar Pandoc y WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: 📄 Convertir a PDF
        run: pandoc readme.md -o readme.pdf --pdf-engine=weasyprint

      - name: 📤 Subir PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: formulario-pdf
          path: readme.pdf
          retention-days: 30
