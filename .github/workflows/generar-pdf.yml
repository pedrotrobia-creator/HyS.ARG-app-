name: Generar PDF del Formulario

on:
  push:
    paths:
      - 'formularios/formulario-completo.md'
  workflow_dispatch:

jobs:
  to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Obtener archivos
        uses: actions/checkout@v4

      - name: 📄 Convertir con WeasyPrint
              - name: Instalar WeasyPrint y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y weasyprint
          pip install markdown

      - name: Convertir Markdown a PDF
        run: |
          # Reemplaza "tu-archivo.md" por el nombre real de tu archivo
          weasyprint tu-archivo.md salida.pdf
        with:
          input: 'formularios/formulario-completo.md'
          output: 'formularios/formulario-completo.pdf'

      - name: 📤 Subir PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: formulario-pdf
          path: formularios/formulario-completo.pdf
          retention-days: 30
