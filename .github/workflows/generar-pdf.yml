name: Generar PDF del Formulario

on:
  push:
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  to-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Obtener archivos
        uses: actions/checkout@v4

      - name: 📦 Instalar Pandoc y WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: 📄 Convertir README.md a PDF
        run: |
          pandoc README.md -o README.pdf --pdf-engine=weasyprint
          echo "✅ PDF generado correctamente"
          ls -la README.pdf

      - name: 📤 Subir PDF generado
        uses: actions/upload-artifact@v4
        with:
          name: formulario-pdf
          path: README.pdf
          retention-days: 30
